# Copy to .github/dependabot.yml. Branches are dependabot/* (allowed); titles use Conventional Commits.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci", include: scope }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore", prefix-development: "chore", include: scope }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
