# Reusable: validates the PR head branch name: type/issue-slug (issue number optional, e.g. feat/123-add-login).
# Allowed extras: dependabot/*, release-please--*, GitHub UI reverts (revert-<n>-*).
name: branch-name
on:
  workflow_call:
permissions: {}
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
          PATTERN: '^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[a-z0-9]+(-[a-z0-9]+)*|dependabot/.+|release-please--.+|revert-[0-9]+-.+)$'
        run: |
          set -euo pipefail
          if [ -z "${BRANCH}" ]; then echo "::notice::not a pull_request event; nothing to check"; exit 0; fi
          if [[ ! "${BRANCH}" =~ ${PATTERN} ]]; then
            echo "::error title=Bad branch name::'${BRANCH}' must look like type/issue-slug, e.g. feat/123-add-login (lowercase, hyphens)"
            exit 1
          fi
          echo "ok: ${BRANCH}"
