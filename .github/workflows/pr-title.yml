# Reusable: validates that the PR title is a Conventional Commit (the squash-merge commit title).
# No third-party actions. Caller must trigger on pull_request types: opened, edited, synchronize, reopened.
name: pr-title
on:
  workflow_call:
permissions: {}
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PATTERN: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^[:space:]].*$'
        run: |
          set -euo pipefail
          if [ -z "${TITLE}" ]; then echo "::notice::not a pull_request event; nothing to check"; exit 0; fi
          if [ "${#TITLE}" -gt 100 ]; then
            echo "::error title=PR title too long::${#TITLE} chars (max 100)"; exit 1
          fi
          if [[ ! "${TITLE}" =~ ${PATTERN} ]]; then
            echo "::error title=PR title is not a Conventional Commit::'${TITLE}' must look like: type(scope)!: summary (#123)"
            echo "types: feat fix docs style refactor perf test build ci chore revert"
            exit 1
          fi
          echo "ok: ${TITLE}"
