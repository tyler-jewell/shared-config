# Reusable: gitleaks secret scan. Full history on push, only the PR's commits on pull_request.
# gitleaks is downloaded at a pinned version and verified by sha256 (pinned value AND the release checksums file).
name: secrets-scan
on:
  workflow_call:
permissions: {}
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL --retry 3 -o "${dir}/${tgz}" "${base}/${tgz}"
          curl -fsSL --retry 3 -o "${dir}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          echo "${GITLEAKS_SHA256}  ${dir}/${tgz}" | sha256sum -c -
          (cd "${dir}" && grep " ${tgz}\$" checksums.txt | sha256sum -c -)
          tar -xzf "${dir}/${tgz}" -C "${dir}" gitleaks
          sudo install -m 0755 "${dir}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          args=(git --no-banner --redact --verbose)
          [ -f .gitleaks.toml ] && args+=(--config .gitleaks.toml)
          if [ "${EVENT}" = "pull_request" ]; then
            args+=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          gitleaks "${args[@]}" .
