# Reusable "picker": decides `runs-on` for downstream jobs. Token-free MODE switch (repository/org
# variable RUNNER_MODE, or the `mode` input):
#   hosted (default when unset): always the hosted fallback (ubuntu-latest)
#   studio: trusted events go to the self-hosted Mac Studio labels, no API call, no token
#   auto:   ask the REST API if a matching runner is online/idle (needs the optional secret)
# Untrusted events and fork PRs ALWAYS use the hosted fallback. GitHub has no automatic fallback
# (a job targeting self-hosted labels with no online runner queues for up to 24h), so in `studio`
# mode the Studio being down means jobs queue; flip the variable to `hosted` (bin/runner-mode).
#
# Caller pattern (see docs/RUNNERS.md):
#   pick:
#     (call) tyler-jewell/shared-config/.github/workflows/select-runner.yml@v1
#     with:
#       mode: ${{ vars.RUNNER_MODE }}
#   build:
#     needs: pick
#     runs-on: ${{ fromJSON(needs.pick.outputs.runs-on) }}
#
# The picker never fails the pipeline: any problem (no token, API error, missing script) degrades
# to the fallback label with a precise `reason` output.
name: select-runner
on:
  workflow_call:
    inputs:
      mode:
        description: studio | hosted | auto. Empty => the caller repo/org variable RUNNER_MODE, else hosted
        type: string
        default: ''
      os:
        description: "macos (labels: mac-studio) or linux (labels: mac-studio-linux, the Lima VM runner)"
        type: string
        default: macos
      labels:
        description: Comma list overriding the self-hosted labels of `os` (self-hosted is prepended)
        type: string
        default: ''
      fallback:
        description: runs-on when not self-hosted (string label, or a JSON array)
        type: string
        default: ubuntu-latest
      prefer-queue:
        description: Use the self-hosted runner even when every matching runner is busy
        type: boolean
        default: false
    secrets:
      runner-status-token:
        description: Only for mode auto. Fine-grained PAT, repository permission Administration read. Optional; empty => fallback
        required: false
    outputs:
      runs-on:
        description: JSON value for runs-on, use with fromJSON()
        value: ${{ jobs.pick.outputs.runs-on }}
      reason:
        description: Decision slug (see docs/RUNNERS.md)
        value: ${{ jobs.pick.outputs.reason }}
      selfhosted:
        description: "'true' when the self-hosted runner was chosen"
        value: ${{ jobs.pick.outputs.selfhosted }}
      macos:
        description: runs-on JSON for the macOS label set (use in matrices)
        value: ${{ jobs.pick.outputs.macos }}
      linux:
        description: runs-on JSON for the Linux (Lima VM) label set (use in matrices)
        value: ${{ jobs.pick.outputs.linux }}
      mode:
        description: The mode that was applied
        value: ${{ jobs.pick.outputs.mode }}
permissions: {}
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
      reason: ${{ steps.pick.outputs.reason }}
      selfhosted: ${{ steps.pick.outputs.selfhosted }}
      macos: ${{ steps.pick.outputs.macos }}
      linux: ${{ steps.pick.outputs.linux }}
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      # Fetch the script from the exact commit of THIS reusable workflow file. In a reusable
      # workflow the `github` context is the caller's (github.workflow_sha is the caller's file);
      # the documented `job.workflow_sha` is the commit of the file that defines this job (github.com
      # only, not GHES). There is no documented `github.job_workflow_sha`. If `job.workflow_sha` is
      # ever empty we fall back to the floating tag v1. The repository is hard-coded on purpose.
      # continue-on-error: the run step degrades to the fallback if this fails.
      - name: Fetch select-runner.sh
        id: fetch
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: tyler-jewell/shared-config
          ref: ${{ job.workflow_sha || 'v1' }}
          sparse-checkout: scripts
          path: .select-runner-src
          persist-credentials: false
      - name: Pick runner
        id: pick
        shell: bash
        env:
          # `vars` is the caller's repo/org variable set (the docs do not state this for called
          # workflows explicitly; callers may pass `mode: ${{ vars.RUNNER_MODE }}` to be certain).
          MODE: ${{ inputs.mode || vars.RUNNER_MODE || 'hosted' }}
          OS_TARGET: ${{ inputs.os }}
          GH_TOKEN: ${{ secrets.runner-status-token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          LABELS: ${{ inputs.labels }}
          FALLBACK: ${{ inputs.fallback }}
          PREFER_QUEUE: ${{ inputs.prefer-queue }}
        run: |
          set +x
          script=.select-runner-src/scripts/select-runner.sh
          rc=0
          if [ -f "$script" ]; then
            bash "$script" || rc=$?
          else
            rc=255
          fi
          if [ "$rc" -eq 64 ]; then
            echo "::warning::select-runner reported invalid usage/env (exit 64); fallback was emitted"
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::select-runner unavailable (exit $rc, fetch=${{ steps.fetch.outcome }}); using fallback"
            f="${FALLBACK:-ubuntu-latest}"
            case "$f" in "["*) j="$f" ;; *) j=$(printf '%s' "$f" | jq -Rsc .) ;; esac
            {
              echo "runs-on=$j"
              echo "reason=picker-unavailable"
              echo "selfhosted=false"
              echo "macos=$j"
              echo "linux=$j"
              echo "mode=hosted"
            } >> "$GITHUB_OUTPUT"
          fi
