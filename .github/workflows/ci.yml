# Self-test CI for shared-config itself: runs the test suite and exercises the reusable workflows via local refs.
# Gate jobs `ci` and `pr-title` are plain jobs so the required-status-check contexts are exactly
# `ci` and `pr-title` (a reusable-workflow job would report as "<job> / <inner job>").
name: ci
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Picker: RUNNER_MODE=studio sends trusted (same-repo) events to the self-hosted Mac Studio; default
  # hosted = ubuntu-latest. Fork PRs/untrusted events always hosted. Never fails the pipeline (see docs/RUNNERS.md).
  pick:
    uses: ./.github/workflows/select-runner.yml
    permissions:
      contents: read
    with:
      mode: ${{ vars.RUNNER_MODE }}   # hosted (default) | studio | auto; flip with bin/runner-mode
  title-lint:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-title.yml
  branch-name:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/branch-name.yml
  secrets-scan:
    uses: ./.github/workflows/secrets-scan.yml
    permissions:
      contents: read
  dco:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dco.yml
    permissions:
      contents: read
  wrangler-warning:
    uses: ./.github/workflows/wrangler-warning.yml
    permissions:
      contents: read
  agent-dx:
    uses: ./.github/workflows/agent-dx.yml
    permissions:
      contents: read

  # Primary test job: runs where the picker says (Studio, or ubuntu-latest as fallback).
  tests:
    needs: pick
    runs-on: ${{ fromJSON(needs.pick.outputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: bash tests/run.sh
  # Linux portability is always proven exactly once: this extra job runs only when the primary
  # job went to the Studio (when the picker chose ubuntu-latest, `tests` already is the Linux run).
  tests-linux:
    needs: pick
    if: needs.pick.outputs.selfhosted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: bash tests/run.sh

  pr-title:
    if: always()
    needs: [title-lint]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          R: ${{ needs.title-lint.result }}
        run: '[ "$R" = success ] || [ "$R" = skipped ]'
  ci:
    if: always()
    needs: [pick, tests, tests-linux, branch-name, secrets-scan, dco, wrangler-warning, agent-dx]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || [ "$r" = skipped ] || { echo "failed: $RESULTS"; exit 1; }; done
